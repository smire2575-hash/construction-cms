function menu(){return mode==='platform'?['Dashboard','Companies','Subscriptions','Modules','Invoices','Payments','Audit','Settings'].map(n=>`<button data-page="${n}" class="nav-item ${page===n?'active':''}">${icon(n)}<span>${n}</span></button>`).join(''):groups.map(g=>`<div class="nav-group"><div class="nav-heading">${g[0]}</div>${g[1].map(n=>`<button data-page="${n}" class="nav-item ${page===n?'active':''}">${icon(n)}<span>${n}</span></button>`).join('')}</div>`).join('')}

const configs={products:[['sku','SKU'],['name','Magaca'],['category','Nooca'],['stock','Stock'],['price','Selling Price']],sales:[['reference','Invoice'],['product','Alaabta'],['qty','Tiro'],['total','Amount'],['payment','Payment'],['status','Status']],contacts:[['name','Magaca'],['kind','Nooca'],['phone','Phone'],['balance','Balance']],tasks:[['title','Hawsha'],['owner','Mas’uulka'],['due','Taariikh'],['status','Xaalad']],employees:[['name','Shaqaale'],['role','Role'],['branch','Branch'],['status','Xaalad']],expenses:[['name','Kharashka'],['category','Qaybta'],['amount','Amount'],['status','Xaalad']],purchases:[['supplier','Supplier'],['product','Product'],['qty','Qty'],['total','Total'],['status','Status']],companies:[['name','Company'],['owner','Owner'],['modules','Modules'],['expiry','Expiry'],['status','Status']]};
function table(rows,cols){return `<div class="table-overflow"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(([k])=>`<td>${k==='status'?badge(r[k]):['amount','price','balance','total'].includes(k)?money(r[k]):escapeHtml(r[k]??'—')}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty-table" colspan="${cols.length}">Weli wax xog ah lama hayo</td></tr>`}</tbody></table></div>`}
function stats(a){return `<div class="stats-grid">${a.map(([i,t,v,h],ix)=>`<div class="stat"><div class="stat-head"><span>${t}</span><span class="stat-icon ${['blue','gold','green','purple'][ix%4]}">${icon(i)}</span></div><strong>${v}</strong><small>${h}</small></div>`).join('')}</div>`}
function dashboard(){const rev=db.sales.filter(x=>x.status!=='Pending').reduce((a,s)=>a+ +s.total,0),cost=db.sales.filter(x=>x.status!=='Pending').reduce((a,s)=>a+ +s.costTotal,0),expense=db.expenses.reduce((a,e)=>a+ +e.amount,0);return `<div class="welcome"><div><span class="eyebrow">WAR-BIXINTA GUUD</span><h1>Subax wanaagsan, CMS Team <span>✦</span></h1><p>La soco iibka, kharashaadka iyo dhaq-dhaqaaqa shirkadda hal meel.</p></div><button class="btn primary" data-modal="sale">+ Iib cusub</button></div>${stats([['Sales','Wadarta iibka',money(rev),'Demo transactions'],['Accounting','Faa’iido qiyaas ah',money(rev-cost-expense),'Revenue − cost − expenses'],['Inventory','Noocyada alaabta',db.products.length,'Alaabo diiwaangashan'],['Contacts','Macaamiisha',db.contacts.filter(c=>c.kind==='Customer').length,'Customer records']])}<div class="content-grid"><div class="panel"><div class="panel-title"><div><h2>Isbeddelka iibka</h2><p>Muujin tusaale ah — 2026</p></div><span class="tiny-tag">Monthly</span></div><div class="chart-bars">${[42,54,47,61,58,73,68,78,65,90,75,100].map((v,i)=>`<div class="chart-column"><span class="bar" style="height:${v}%"></span><small>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}</small></div>`).join('')}</div></div><div class="panel"><div class="panel-title"><h2>Xaaladda Bakhaarka</h2>${icon('Inventory')}</div>${db.products.slice(0,5).map(p=>`<div class="stock-item"><div><b>${escapeHtml(p.name)}</b><small>${p.stock} ${escapeHtml(p.unit)} stock</small></div>${badge(+p.stock<+p.low?'Pending':'Active')}</div>`).join('')}</div></div><div class="content-grid"><div class="panel"><div class="panel-title"><h2>Iibyadii ugu dambeeyey</h2><button class="link-btn" data-page="Sales">Dhammaan →</button></div>${table(db.sales.slice(0,4),configs.sales)}</div><div class="panel"><div class="panel-title"><h2>Hawlaha dhow</h2><button class="link-btn" data-page="To-do">Arag →</button></div>${db.tasks.map(t=>`<div class="activity"><span class="activity-dot"></span><div><b>${escapeHtml(t.title)}</b><small>${escapeHtml(t.owner)} · ${t.due}</small></div>${badge(t.status)}</div>`).join('')}</div></div>`}
function listing(resource,title){const items=(db[resource]||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase()));return `<div class="page-heading"><div><span class="eyebrow">CMS / ${page.toUpperCase()}</span><h1>${title}</h1><p>Diwaanada maamulka iyo xogta tijaabada. Isbedelku wuxuu ku jiraa browser-kaaga.</p></div><div class="actions"><button class="btn" data-print>Daabac</button><button class="btn primary" data-modal="${resource==='sales'?'sale':resource}">+ Ku dar cusub</button></div></div><div class="panel"><div class="table-toolbar"><div class="search-field"><span>⌕</span><input id="data-search" value="${escapeHtml(search)}" placeholder="Raadi record..."/></div><span class="tiny-tag">${items.length} Records</span></div>${table(items,configs[resource])}</div>`}
function generic(){const arr=db.moduleRecords[page]||[];return `<div class="page-heading"><div><span class="eyebrow">CMS / ${page.toUpperCase()}</span><h1>${page}</h1><p>Qaybtan waxay ka tirsan tahay qorshaha Full 24-Module System.</p></div><button class="btn primary" data-modal="generic">+ Diiwaan cusub</button></div><div class="module-panel"><div class="module-icon">${icon(page)}</div><h2>${page} Management</h2><p>Qaab tijaabo ah: ku dar record, eeg xogta, sii qorshee workflow-yada gaar ahaaneed. Sharciyada iyo integrations-ka buuxa waa qaybaha dambe ee dhismaha.</p><div class="mini-features"><span>🔒 Tenant safe</span><span>▦ 24 Modules</span><span>✔ Permissions Planned</span></div></div><div class="panel"><div class="panel-title"><h2>Diiwaannada ${page}</h2><span class="tiny-tag">${arr.length}</span></div>${table(arr,[['name','Magaca'],['description','Sharaxaad'],['status','Status']])}</div>`}
function accounting(){const rev=db.sales.filter(x=>x.status!=='Pending').reduce((a,s)=>a+s.total,0),cost=db.sales.reduce((a,s)=>a+s.costTotal,0),exp=db.expenses.reduce((a,e)=>a+e.amount,0);return `<div class="page-heading"><div><span class="eyebrow">CMS / MAALIYADDA</span><h1>Xisaabaadka</h1><p>Branch cash/bank, GL, Multi-Currency iyo financial controls.</p></div><span class="tiny-tag">DEMO / PLANNED FULL ENGINE</span></div>${stats([['Sales','Dakhliga',money(rev),'Sales'],['Accounting','COGS',money(cost),'Inventory cost'],['Expenses','Kharashka',money(exp),'Operating expenses'],['Dashboards','Faa’iido',money(rev-cost-exp),'Qiyaas']])}<div class="panel"><h2>Accounting Policies</h2><div class="account-rules"><div>✓ Hal General Ledger oo shirkadda oo dhan ah</div><div>✓ Cash/bank accounts branch kasta</div><div>✓ Cash, Credit iyo Installment payments</div><div>✓ Posted records: reversal, not deletion</div></div><div class="info-box">Waxyaabahan waxaa lagu dhammaystirayaa Supabase SQL iyo Node API marka live services la hawlgeliyo. Dashboard-kan ma aha warbixin audited ah.</div></div>`}
function adminContent(){if(page==='Dashboard'){return `<div class="welcome"><div><span class="eyebrow">CMS PLATFORM</span><h1>Super Admin Dashboard</h1><p>Companies, subscriptions, modules, invoices iyo xaddidaad.</p></div><button class="btn primary" data-modal="companies">+ Shirkad cusub</button></div>${stats([['Companies','Companies',db.companies.length,'Tenant accounts'],['Dashboards','Active',db.companies.filter(x=>x.status==='Active').length,'Active'],['Subscriptions','Trials',db.companies.filter(x=>x.status==='Trial').length,'Trial period'],['Payments','MRR (tusaale)',money(db.companies.filter(x=>x.status==='Active').reduce((a,x)=>a+x.amount,0)),'Demo billing']])}<div class="panel"><div class="panel-title"><h2>Companies-ka CMS</h2><button class="link-btn" data-page="Companies">Maamul →</button></div>${table(db.companies,configs.companies)}</div>`}
 if(page==='Companies')return listing('companies','Shirkadaha CMS');if(page==='Modules')return `<div class="page-heading"><h1>24-Module Catalog</h1></div><div class="panel"><div class="module-grid">${groups.flatMap(g=>g[1]).map((m,i)=>`<div class="catalog-item">${icon(m)}<div><b>${m}</b><small>${i+1} / 24 modules</small></div></div>`).join('')}</div></div>`;
 return `<div class="page-heading"><h1>${page}</h1></div><div class="panel">${table(db.companies,configs.companies)}<div class="info-box">Tani waa Super Admin DEMO. Billing, payment verification iyo subscription activation dhab ah waxay u baahan yihiin API iyo Supabase configuration.</div></div>`;
}
function body(){if(mode==='platform')return adminContent();if(page==='Dashboards')return dashboard();if(page==='Accounting')return accounting();if(page==='Settings')return `<div class="page-heading"><h1>Dejinta Shirkadda</h1></div><div class="settings-grid"><div class="panel"><h2>Company</h2><p>Al-Nuur Construction Supply</p><p>Currency: USD</p><p>Primary Owner: seat-free</p></div><div class="panel"><h2>Resource Limits</h2><div class="setting-row"><span>Branches</span><b>3</b></div><div class="setting-row"><span>Warehouses</span><b>5</b></div><div class="setting-row"><span>Employee seats</span><b>15</b></div></div></div>`;
 if(page==='Apps')return `<div class="page-heading"><h1>CMS 24 Modules</h1></div><div class="panel"><div class="module-grid">${groups.flatMap(g=>g[1]).map(m=>`<div class="catalog-item">${icon(m)}<div><b>${m}</b><small>Planned full module</small></div>${badge('Active')}</div>`).join('')}</div></div>`;
 const res=({'Contacts':'contacts','CRM':'contacts','Sales':'sales','Point of Sale':'sales','Inventory':'products','Barcode':'products','Purchase':'purchases','Expenses':'expenses','To-do':'tasks','Employees':'employees'})[page];if(res)return listing(res,page==='Inventory'?'Maareynta Bakhaarka':page);return generic()}

function fieldsFor(type){if(type==='sale')return `<label>Alaabta<select name="productId" required>${db.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${money(p.price)} — Kayd: ${p.stock}</option>`).join('')}</select></label><div class="form-grid"><label>Tiro<input required name="qty" type="number" min="0.001" step="0.001"/></label><label>Payment<select name="payment"><option>Cash</option><option>Credit</option><option>Installment</option></select></label></div><div class="info-box">Oversell → Pending Delivery (no stock deduction); Actual Supabase sale RPC rejects oversell until approved fulfillment exists.</div>`;
const maps={products:[['name','Magaca'],['sku','SKU'],['category','Category'],['unit','Unit'],['cost','Cost','number'],['price','Price','number'],['stock','Stock','number'],['low','Low Stock','number']],contacts:[['name','Magaca'],['kind','Customer/Supplier'],['phone','Phone']],expenses:[['name','Kharashka'],['category','Category'],['amount','Amount','number']],tasks:[['title','Task'],['owner','Mas’uulka'],['due','Deadline','date']],employees:[['name','Name'],['role','Role'],['branch','Branch']],purchases:[['supplier','Supplier'],['product','Product'],['qty','Quantity','number'],['total','Total','number']],companies:[['name','Company'],['owner','Owner']],generic:[['name','Title'],['description','Description']]};return (maps[type]||maps.generic).map(([key,label,inputType])=>`<label>${label}<input required name="${key}" type="${inputType||'text'}" step="any"/></label>`).join('')}
function openModal(type){modal=type;const shade=document.createElement('div');shade.className='modal-shade preview-modal';shade.innerHTML=`<div class="modal-panel"><div class="modal-top"><h2>CMS — ${type==='sale'?'Iib cusub':type==='generic'?page+' New Record':type+' cusub'}</h2><button class="icon-btn" id="modal-close">✕</button></div><form class="modal-form" id="modal-form">${fieldsFor(type)}<div class="form-actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Kaydi</button></div></form></div>`;shade.addEventListener('click',e=>{if(e.target===shade)shade.remove()});document.body.append(shade);shade.querySelector('#modal-close').onclick=()=>shade.remove();shade.querySelector('#cancel').onclick=()=>shade.remove();shade.querySelector('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const uid=id();if(type==='sale'){const p=db.products.find(x=>x.id===v.productId);const qty=+v.qty;if(!p||qty<=0)return alert('Tiro sax ah geli');const over=qty>p.stock;db.sales.unshift({id:uid,reference:(over?'MOG-ORD-':'MOG-INV-')+String(Date.now()).slice(-6),product:p.name,qty,total:p.price*qty,costTotal:over?0:p.cost*qty,payment:v.payment,status:over?'Pending':v.payment==='Cash'?'Paid':v.payment==='Credit'?'Due':'Partial'});if(!over)p.stock-=qty;else alert(`Alaabta oo dhan ma jirto (${p.stock} stock). Dalabka wuxuu sugayaa Pending Delivery; invoice ma samaysmin.`)}else if(type==='generic'){db.moduleRecords[page]=[{id:uid,...v,status:'Active'},...(db.moduleRecords[page]||[])]}else{const out={id:uid,...v,status:type==='expenses'||type==='tasks'||type==='purchases'?'Pending':'Active'};['stock','cost','price','low','amount','qty','total'].forEach(k=>{if(k in out)out[k]=Number(out[k])});db[type].unshift(out)}save();shade.remove();render();};}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;search='';render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;page=mode==='platform'?'Dashboard':'Dashboards';search='';render()});document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>window.print());document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>alert('CMS Demo: Ogeysiisyo cusub ma jiraan.'));const input=document.getElementById('data-search');if(input)input.addEventListener('input',e=>{search=e.target.value;const caret=e.target.selectionStart;render();const el=document.getElementById('data-search');el.focus();el.setSelectionRange(caret,caret)});const mb=document.getElementById('mobile');if(mb)mb.onclick=()=>{document.querySelector('.sidebar').classList.toggle('open');let overlay=document.querySelector('.mobile-backdrop');if(!overlay){overlay=document.createElement('div');overlay.className='mobile-backdrop';overlay.onclick=()=>{document.querySelector('.sidebar').classList.remove('open');overlay.remove()};document.querySelector('.app-layout').append(overlay)}else overlay.remove()}}
render();
</script></body></html>
